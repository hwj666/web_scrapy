# 标题清洗规则：与站点无关，可热更
title:
  separators:
    - "\\s*[_|｜·]+\\s*"
    - "\\s+[-–—]+\\s+"
  prefix_patterns:
    - "^(?:正在播放|在线播放|立即播放|播放|视频|影片|详情)\\s*[:：]\\s*"
  suffix_patterns:
    - "(?:\\s*[-_|｜]\\s*|\\s+)(?:高清|超清|蓝光|HD|免费|在线观看|在线播放|完整版|未删减版)\\s*$"
  wrap_chars: " \t\r\\n\"'“”‘’「」『』[]【】()（）<>《》"
  site_words:
    - "影院"
    - "影视"
    - "剧场"
    - "网站"
    - "网址"
    - "官网"
    - "在线"
    - "资源"
    - "分享"
    - "首页"
    - "app"
    - "vip"
  episode_patterns:
    - "^(?:第\\s*\\d+\\s*[集话話期]|EP?\\s*\\d+)$"
  generic_titles:
    - "首页"
    - "主页"
    - "排行榜"
